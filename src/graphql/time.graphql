# Wipe lifecycle types.
#
# The platform deletes itself every 40 days (see src/server/wipe.js and
# docs/wipe-architecture.md). `nextWipe` is backed by the WipeCycle table and
# lazy-wipes: if a cycle is overdue when the countdown is queried, the purge
# runs first and the new cycle's date is returned.
#
# `triggerWipe` is the manual, auth-required escape hatch. It is NOT how the
# scheduled wipe happens — the countdown query drives that.
