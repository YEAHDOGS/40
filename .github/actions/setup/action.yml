name: Setup
description: Node + pnpm + dependencies (shared by every job)
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json # engines.node
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
