# Builds every platform. Runs on version tags (v0.0.1) and on demand (Actions tab -> Build -> Run workflow).
#
# Signing is optional: add the secrets listed in docs/BUILDING.md and the same jobs produce signed builds.
# Missing secrets => unsigned builds (iOS: a simulator compile check). Created by DOGS.
name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # Repo "Variables" (Settings -> Secrets and variables -> Actions -> Variables)
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:web
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/web
      - name: Deploy Worker (tags only, when CLOUDFLARE_API_TOKEN is set)
        if: startsWith(github.ref, 'refs/tags/') && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm db:migrate:remote && pnpm wrangler deploy

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            args: ''
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tauri
      - uses: ./.github/actions/setup
      - run: pnpm build:desktop ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/desktop

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Point Tauri at the preinstalled Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tauri
      - uses: ./.github/actions/setup
      - run: pnpm build:android
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/android

  ios:
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tauri
      - uses: ./.github/actions/setup
      - run: pnpm build:ios
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/ios
          if-no-files-found: ignore # unsigned runs only compile-check

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -path artifacts/web -prune -o -type f -print
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            $(find artifacts -path artifacts/web -prune -o -type f -print)
