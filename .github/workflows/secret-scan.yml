name: secret-scan

# Fail the build when something that looks like a real credential is committed.
# Runs the dependency-free scanner in scripts/secret-scan.js over the git tree.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: scan for committed secrets
        run: node scripts/secret-scan.js
